<script type="text/babel">
const ACCENT_FIRE = {
  c: "#FF4A2A", c700: "#E2331C", c300: "#FFA98F",
  soft: "rgba(255,74,42,.12)", soft2: "rgba(255,74,42,.22)", glow: "rgba(255,74,42,.35)",
};

(function applyAccent() {
  const r = document.documentElement.style;
  r.setProperty("--accent", ACCENT_FIRE.c);
  r.setProperty("--accent-700", ACCENT_FIRE.c700);
  r.setProperty("--accent-300", ACCENT_FIRE.c300);
  r.setProperty("--accent-soft", ACCENT_FIRE.soft);
  r.setProperty("--accent-soft-2", ACCENT_FIRE.soft2);
  r.setProperty("--accent-glow", ACCENT_FIRE.glow);
})();

function useReveal() {
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      }
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function App() {
  useReveal();
  useStaggerReveal();
  useHeroParallax();

  return (
    <React.Fragment>
      <ScrollProgress />
      <CFNav />
      <CFHero />
      <CFProblem />
      <CFPivot />
      <CFFlow />
      <CFCallout />
      <CFTwoSided />
      <CFForWhom />
      <CFTrust />
      <CFFinal />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
