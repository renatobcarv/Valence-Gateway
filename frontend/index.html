<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valence — Split de pagamentos para criadores</title>
<meta name="description" content="A Valence divide pagamentos automático entre criadores, podcasters e agências. Cada colaborador recebe via Pix, em segundos, sem planilha e sem confusão.">

<!-- Fonts: Bricolage Grotesque (display) + Geist (body) + Geist Mono (numbers) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<!-- Favicon: Valence V mark in fire orange -->
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF4A2A'/><path d='M22 28 L48 28 L48 56 L36 56 L50 86 L50 86 L80 16 Z' fill='white'/></svg>">
</head>
<body>
<div id="root"></div>

<!-- React + Babel pinned -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/04-motion.jsx"></script>
<script type="text/babel" src="components/01-top.jsx"></script>
<script type="text/babel" src="components/02-middle.jsx"></script>
<script type="text/babel" src="components/03-bottom.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "fire",
  "heroVariant": "A",
  "ctaText": "Começar agora"
}/*EDITMODE-END*/;

const ACCENTS = {
  fire:    { c: "#FF4A2A", c700: "#E2331C", c300: "#FFA98F", soft: "rgba(255,74,42,.12)",  soft2: "rgba(255,74,42,.22)",  glow: "rgba(255,74,42,.35)",  label: "Laranja fogo" },
  crimson: { c: "#E63A1F", c700: "#B82811", c300: "#FF9079", soft: "rgba(230,58,31,.12)",  soft2: "rgba(230,58,31,.22)",  glow: "rgba(230,58,31,.4)",   label: "Vermelho" },
  ember:   { c: "#FF7A1A", c700: "#E15C00", c300: "#FFC394", soft: "rgba(255,122,26,.12)", soft2: "rgba(255,122,26,.22)", glow: "rgba(255,122,26,.35)", label: "Âmbar" },
};

const CTA_OPTIONS = [
  "Começar agora",
  "Criar conta grátis",
  "Quero dividir certo",
  "Testar com meu time",
];

function useReveal() {
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      }
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function applyAccent(name) {
  const a = ACCENTS[name] || ACCENTS.fire;
  const r = document.documentElement.style;
  r.setProperty("--accent", a.c);
  r.setProperty("--accent-700", a.c700);
  r.setProperty("--accent-300", a.c300);
  r.setProperty("--accent-soft", a.soft);
  r.setProperty("--accent-soft-2", a.soft2);
  r.setProperty("--accent-glow", a.glow);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => { applyAccent(t.accent); }, [t.accent]);
  useReveal();
  useStaggerReveal();
  useHeroParallax();

  return (
    <React.Fragment>
      <ScrollProgress />
      <Nav ctaText={t.ctaText} />
      <Hero variant={t.heroVariant} ctaText={t.ctaText} />
      <BrandStrip />
      <ComoFunciona />
      <LiveSplit />
      <Stats />
      <Pricing />
      <FAQ />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Visual" />
        <TweakColor
          label="Accent color"
          value={ACCENTS[t.accent].c}
          options={[ACCENTS.fire.c, ACCENTS.crimson.c, ACCENTS.ember.c]}
          onChange={(hex) => {
            const name = hex === ACCENTS.crimson.c ? "crimson" : hex === ACCENTS.ember.c ? "ember" : "fire";
            setTweak("accent", name);
          }}
        />

        <TweakSection label="Mensagem do hero" />
        <TweakRadio
          label="Copy"
          value={t.heroVariant}
          options={["A", "B", "C"]}
          onChange={(v) => setTweak("heroVariant", v)}
        />
        <div style={{ fontSize: 11, color: "rgba(41,38,27,.55)", lineHeight: 1.45, padding: "2px 2px 0" }}>
          {t.heroVariant === "A" && "A · Direto: \"Receba sua parte na hora\""}
          {t.heroVariant === "B" && "B · Problema/Solução: \"Cansado de dividir manualmente?\""}
          {t.heroVariant === "C" && "C · Aspiração: \"Trabalhe em time, receba separado\""}
        </div>

        <TweakSection label="Botão de ação" />
        <TweakSelect
          label="Texto do CTA"
          value={t.ctaText}
          options={CTA_OPTIONS}
          onChange={(v) => setTweak("ctaText", v)}
        />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
